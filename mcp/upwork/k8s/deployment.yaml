apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudo-upwork-mcp
  namespace: default
  labels:
    app: sudo-upwork-mcp
    kind: upwork-mcp
spec:
  # Recreate, not RollingUpdate: hostNetwork + a fixed port (9232) means a
  # rolling update would try to bind the same node port from two pods at once.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: sudo-upwork-mcp
      kind: upwork-mcp
  template:
    metadata:
      labels:
        app: sudo-upwork-mcp
        kind: upwork-mcp
    spec:
      hostNetwork: true
      dnsPolicy: Default
      containers:
        - name: upwork-mcp
          image: sudo-upwork-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mcp
              containerPort: 9232
              protocol: TCP
          env:
            # CIMD client_id = public metadata URL (no secret; see oauth/client-metadata.json)
            - name: UPWORK_CLIENT_ID
              value: "https://cdn.jsdelivr.net/gh/salmonhealer772/sudo-fleet@main/mcp/upwork/oauth/client-metadata.json"
            # Loopback redirect on the operator's Mac (matched by client-metadata.json)
            - name: UPWORK_REDIRECT_URI
              value: "http://127.0.0.1:8747/callback"
            # Token file on the PVC (never in git)
            - name: UPWORK_TOKEN_FILE
              value: "/data/tokens.json"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 9232
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 9232
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sudo-upwork-mcp-data
