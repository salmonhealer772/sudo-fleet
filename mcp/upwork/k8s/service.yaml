apiVersion: v1
kind: Service
metadata:
  name: sudo-upwork-mcp
  namespace: default
  labels:
    app: sudo-upwork-mcp
    kind: upwork-mcp
spec:
  type: ClusterIP
  selector:
    app: sudo-upwork-mcp
    kind: upwork-mcp
  ports:
    # Stable service port 8000 -> the pod's deterministic hostNetwork port
    # (9232 = 8000 + cksum("upwork") % 22000, the fleet's per-agent MCP_PORT
    # convention). Agents reach it as ClusterIP:8000/mcp.
    - name: mcp
      port: 8000
      targetPort: 9232
      protocol: TCP
