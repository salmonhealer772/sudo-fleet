apiVersion: v1
kind: Service
metadata:
  name: sudo-llm
  labels:
    app: sudo-llm
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
# The llama.cpp server runs as a host-network docker container (--gpus all),
# not a k8s pod, because the nvidia-container-toolkit runtime is wired into
# docker (--gpus all) and k3s/containerd device-plugin plumbing is not needed
# for a single 8GB GPU. The agent pod is hostNetwork, so it reaches the server
# at 127.0.0.1:8080. This Endpoints object gives the server a stable in-cluster
# name (http://sudo-llm:8080) for the hostNetwork agent and any other pod that
# shares the node network namespace.
apiVersion: v1
kind: Endpoints
metadata:
  name: sudo-llm
  labels:
    app: sudo-llm
subsets:
- addresses:
  - ip: 127.0.0.1
  ports:
  - name: http
    port: 8080
