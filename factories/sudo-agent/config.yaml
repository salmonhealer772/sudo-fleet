# ── LLM model / provider — ONE source of truth ──────────────────────────────
# provider + base_url live at TOP LEVEL here, NOT nested under `model:`.
#
# Why top-level: for a custom OpenAI-compatible endpoint a bare top-level
# `provider: <name>` + base_url does NOT send the Bearer token — the key must
# live in a `custom_providers` entry (as `api_key`, or better `key_env`, which
# names the env var holding it). The committed default below is DeepSeek direct
# with NO secret in this file; setup.sh rewrites provider/base_url/model.default
# from LLM_PROVIDER / LLM_BASE_URL / LLM_MODEL and, when LLM_BASE_URL points at a
# non-DeepSeek (e.g. Featherless) endpoint, emits the matching custom_providers
# entry. See factories/sudo-agent/setup.sh.
#
# NOTE: a model whose server-reported context is below 64K is REJECTED by Hermes
# ("below the minimum 64,000"). Point at a >=64K-context model, e.g. Featherless
# `deepseek-ai/DeepSeek-V4-Pro` (262144 ctx).
provider: "deepseek"
base_url: "https://api.deepseek.com/v1"
model:
  default: "deepseek-v4-pro"

# ── Example custom OpenAI-compatible endpoint (e.g. Featherless) ────────────
# setup.sh appends a block in exactly this shape when LLM_BASE_URL is custom.
# The key is referenced by ENV VAR NAME (key_env) — never embed a real key in a
# committed file. The referenced env var is injected into the pod by
# bin/up.sh.
# custom_providers:
#   - name: featherless
#     base_url: "https://api.featherless.ai/v1"
#     key_env: LLM_API_KEY
#     api_mode: openai
#     models: ["deepseek-ai/DeepSeek-V4-Pro"]

terminal:
  backend: "local"
  sudo_password_env: "SUDO_PASSWORD"
memory:
  memory_char_limit: 100000
  user_char_limit: 50000
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  nudge_interval: 1

# ── Fleet-shared Google Workspace MCP (Drive + Docs + Sheets) ─────────────
# Remote MCP-over-HTTP server; Hermes native MCP client discovers it at
# startup and registers mcp_google_workspace_* tools. One shared OAuth token
# (operator consented once) — no per-agent auth. Upstream: factories/sudo-gws.
# The per-agent config/<name>.yaml gets this via bin/mcp_servers_enable.py on
# every up.sh deploy; this entry is the tracked template/seed.
mcp_servers:
  google_workspace:
    url: "http://192.168.5.15:27462/mcp"
  regulations:
    url: "http://regulations-mcp.dockets.svc.cluster.local:8080/mcp"
  statutes:
    url: "http://statutes-mcp.dockets.svc.cluster.local:8080/mcp"
  spicy-regs:
    url: "http://spicy-regs-mcp.dockets.svc.cluster.local:8080/mcp"

custom_providers:
  - name: "custom"
    base_url: "https://api.openai.com/v1"
    key_env: LLM_API_KEY
    api_mode: openai
    models: ["gpt-4o", "gpt-4o-mini"]

model_overrides:
  custom:
    gpt-4o:
      supports_reasoning: false
  openai:
    gpt-4o:
      supports_reasoning: false

# ── Hermes API server (platforms.api_server) ──────────────────────────────
# The gateway's own OpenAI-compatible HTTP listener that Paperclip
# (hermes_gateway) wakes over POST /v1/runs. OFF by default in the seed;
# bin/up.sh flips it to `true` via bin/api_server_enable.py and injects the
# API_SERVER_HOST / API_SERVER_PORT / API_SERVER_KEY env vars (the key lives in
# the per-agent ${DEPLOY}-api-server-key Secret, never here). The listener
# host/port default to the API_SERVER_HOST / API_SERVER_PORT env vars; the
# block below only toggles the platform on/off.
platforms:
  api_server:
    enabled: false
