apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sudo-caesar-data
  labels:
    app: sudo-agent
    agent: caesar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sudo-caesar
  labels:
    app: sudo-agent
    agent: caesar
spec:
  replicas: 1
  # Recreate, NOT RollingUpdate: every agent pod runs hostNetwork:true and
  # binds a per-agent fixed port (MCP_PORT) plus takes the /opt/data/gateway.lock
  # on the shared PVC, so a rolling update brings the NEW pod up beside the OLD
  # one and the new pod crash-loops (port already in use / gateway host-lock
  # held by the old pod) while the rollout hangs. The old pod MUST terminate
  # before the new one starts (the same reason redis-up.sh uses Recreate).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sudo-agent
      agent: caesar
  template:
    metadata:
      labels:
        app: sudo-agent
        agent: caesar
      annotations:
        # Digest of the ConfigMap-shipped watch scripts (sidecar + plugin).
        # Bumping it forces a new pod, which is the ONLY way a changed script
        # takes effect: kubectl apply does not roll a Deployment for a
        # ConfigMap edit, and a live process keeps the module it already
        # imported. See the digest note in up.sh.
        #
        # NOTE: this heredoc is UNQUOTED, so bash expands $(...) and
        # `backticks` ANYWHERE in the body — including inside these YAML
        # comments. That is not theoretical: a previous revision of this
        # comment read `kubectl apply` unescaped, so every deploy actually
        # RAN kubectl (with no -f/-k) and printed
        #     error: must specify one of -f and -k
        # into the deploy output, training everyone to ignore the one line a
        # real apply failure would also produce. Backticks here MUST stay
        # backslash-escaped; the manifest self-check after the heredoc is the
        # backstop that catches it if someone forgets.
        sudo-agent/watch-scripts-sha: "14e16be7391c62f694e0f96692e37471fd0489dc9db2e3867e97032d096bad4d"
        # Content digest of the sudo-agent IMAGE (see the image-digest note
        # above the manifest). Bumping it is the ONLY way an image-only change
        # rolls the pod: the tag is 'latest' and imagePullPolicy is
        # IfNotPresent, so without this annotation a rebuilt image would
        # silently keep running the old one in every live pod.
        sudo-agent/image-sha: "sha256:1b0909554d10101998b9d15ec0d5d0c2e9854bec570361e1a836fb4a8e439ebe"
    spec:
      shareProcessNamespace: true
      hostNetwork: true
      initContainers:
      - name: seed-glimor
        image: sudo-agent:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["sh", "-c", "if test -f /opt/data/.glimor-seeded; then exit 0; fi; if ! test -d /seed/hermes; then exit 1; fi; if ! test -f /seed/hermes/SOUL.md; then exit 1; fi; cp -a /seed/hermes/. /opt/data/ && chown -R 10000:10000 /opt/data && touch /opt/data/.glimor-seeded"]
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: seed
          mountPath: /seed
          readOnly: true
      containers:
      - name: sudo-agent
        image: sudo-agent:latest
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        securityContext:
          privileged: true
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: fleet-llm-keys
              key: DEEPSEEK_API_KEY
        # Env var a custom_providers entry references via `key_env` — so a
        # Featherless/custom OpenAI-compatible endpoint's Bearer token resolves
        # inside the pod without the key ever being written to config.yaml.
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: fleet-llm-keys
              key: LLM_API_KEY
        - name: SUDO_PASSWORD
          value: "z36YOrj6H5wWyHsz"
        - name: HERMES_YOLO_MODE
          value: "true"
        - name: MCP_PORT
          value: "22700"
        # Queue namespace for THIS agent's prompt queue in the SHARED Redis.
        # One Redis serves the whole fleet, so the prefix must be unique per
        # agent or two agents would steal each other's prompts.
        - name: AGENT_NAME
          value: "caesar"
        # The SHARED prompt-distributor Redis, reached on the NODE loopback
        # (mcp_entrypoint.sh starts a per-pod local Redis only when this is
        # unset — the offline fallback). NOT a Service name: a hostNetwork pod
        # gets the node resolver, not cluster DNS, so a Service name cannot
        # resolve. See kube-scripts/redis-up.sh.
        - name: REDIS_URL
          value: redis://127.0.0.1:6380/0

        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: config
          mountPath: /opt/data/config.yaml
        # Token-level stream plugin: Hermes scans <HERMES_HOME>/plugins/<key>/
        # for user plugins and HERMES_HOME is /opt/data in this image, so the
        # ConfigMap below lands exactly where discovery looks. Read-only — the
        # plugin writes its tape to /opt/data/watch/stream.jsonl instead.
        - name: watch-plugin
          mountPath: /opt/data/plugins/sudo-watch-stream
          readOnly: true
        # Comm-gate plugin: same discovery dir, mounted read-only (it writes
        # its per-session ledger to /opt/data/comm-gate/state.json instead).
        - name: comm-gate-plugin
          mountPath: /opt/data/plugins/sudo-comm-gate
          readOnly: true
        - name: docker-sock
          mountPath: /var/run/docker.sock
        # ── Self-repair probes: restart on crash/hang ───────────────────────
        # The agent's MCP server (gateway run) listens on MCP_PORT (0.0.0.0).
        # startupProbe gives it a generous window to boot; livenessProbe
        # restarts a hung-but-alive agent (listener gone/stuck); readinessProbe
        # keeps a not-yet-serving agent out of Service rotation. Process crash
        # is already handled by restartPolicy: Always (the default).
        startupProbe:
          tcpSocket:
            port: 22700
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 22700
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 22700
          periodSeconds: 20
          failureThreshold: 3
      # ── Observer sidecar container ────────────────────────────────────────
      # Monitors the agent container (shared PID namespace), captures every
      # message from the Hermes SQLite store into <PVC>/watch/events.jsonl,
      # distills <PVC>/watch/transcript.txt, and serves the HTTP tap on
      # WATCH_PORT. Same image (explicit command — the hermes image has no
      # CMD); no docker socket; runs as uid 10000 so the watch dir on the
      # PVC is owned by the agent uid.
      - name: watch
        image: sudo-agent:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "/opt/watch-sidecar/watch_sidecar.py"]
        securityContext:
          runAsUser: 10000
          runAsNonRoot: true
        env:
        - name: WATCH_PORT
          value: "15885"
        - name: AGENT_NAME
          value: "caesar"
        - name: DEPLOY_NAME
          value: "sudo-caesar"
        volumeMounts:
        - name: data
          mountPath: /opt/data
        - name: watch-config
          mountPath: /opt/watch-sidecar
        # Same plugin mount as the agent container: stream.sh's pre-flight
        # guard and the sidecar's /status check the manifest here, so a missing
        # plugin is a loud error rather than an empty screen.
        - name: watch-plugin
          mountPath: /opt/data/plugins/sudo-watch-stream
          readOnly: true
        - name: comm-gate-plugin
          mountPath: /opt/data/plugins/sudo-comm-gate
          readOnly: true
        # ── Self-repair probes: the sidecar serves GET /healthz -> 200 on
        # WATCH_PORT (binds 0.0.0.0). livenessProbe restarts a hung sidecar;
        # readinessProbe gates Service rotation on the tap being up.
        startupProbe:
          httpGet:
            path: /healthz
            port: 15885
          periodSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 15885
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 15885
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sudo-caesar-data
      - name: seed
        hostPath:
          path: /root/sudo-fleet/deployments/Caesar
          type: Directory
      - name: config
        hostPath:
          path: /root/sudo-fleet/factories/sudo-agent/config/caesar.yaml
          type: File
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: watch-config
        configMap:
          name: sudo-caesar-watch-config
          defaultMode: 0755
      - name: watch-plugin
        configMap:
          name: sudo-caesar-watch-plugin
          defaultMode: 0755
      - name: comm-gate-plugin
        configMap:
          name: sudo-caesar-comm-gate-plugin
          defaultMode: 0755
---
# ── Observer sidecar (watch) ──────────────────────────────────────────────
# ConfigMap consumed by the watch container: the daemon script (mounted
# executable at /opt/watch-sidecar/) + its config.json (log_dir, poll
# interval, port, noisy_sources for the reminder flag).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sudo-caesar-watch-config
  labels:
    app: sudo-agent
    agent: caesar
data:
  watch_sidecar.py: |
    #!/usr/bin/env python3
    """Observer sidecar for a sudo-agent (Hermes) pod.
    
    Faithful port of sudo-letta's kube-scripts/watch_sidecar.py, adapted to the
    Hermes event source. On Hermes there is no append-only messages.jsonl to
    tail; instead the agent runtime durably writes every conversation turn to
    /opt/data/state.db (SQLite, WAL mode) on the data PVC. The byte-watermark
    tail-follow of the Letta daemon is therefore replaced by the faithful
    equivalent: a poll loop over
    
        SELECT ... FROM messages WHERE id > :last_id ORDER BY id
    
    with the ``messages.id`` AUTOINCREMENT value persisted as the cursor in
    ``<log_dir>/state.json`` (restart resumes exactly, never re-reads from 0,
    never backfills — the same guarantees the byte watermarks gave). The DB is
    opened READ-ONLY via a ``file:...?mode=ro`` URI so the sidecar can never
    corrupt the writer's store; WAL mode makes this safe alongside the agent's
    writer.
    
    Three jobs in one process (threads):
    
    1. PROCESS MONITOR — poll /proc every ``poll_interval_sec``; shared PID
       namespace (``shareProcessNamespace: true``) exposes the agent container's
       processes (the pause container is PID 1). Appends ``process_state`` events
       on idle<->active transitions ("agent activity" = cmdline references
       hermes).
    2. CAPTURE — poll state.db for new messages (id cursor) and new sessions
       (rowid cursor); normalize each row into events appended to
       ``<log_dir>/events.jsonl``.
       ALSO maintains ``<log_dir>/transcript.txt`` — a human-readable plain-text
       chat log of ONLY real operator prompts (reminder:false) and assistant
       replies (thinking/tool/session/process_state events and role=tool content
       are excluded). Blank line between exchanges; a
       ``--- conversation: <id> ---`` divider when the conversation changes.
       Appends only. Backfill: none — starts from deployment time.
    3. HTTP TAP — stdlib http.server (threaded) on WATCH_PORT (default 8000):
    
          GET /healthz     -> 200 OK
          GET /status       -> JSON snapshot
          GET /ps           -> JSON list of non-self processes
          GET /events?n=100 -> last N event lines verbatim (JSONL)
          GET /events-stream -> backlog dump + live tail of NEW EVENTS (the
                              original /stream behaviour, preserved verbatim)
          GET /stream?n=20&kinds=reasoning,text&since=<byte offset>
                           -> the WHOLE-RUNTIME stream written by the
                              sudo-watch-stream plugin (<log_dir>/stream.jsonl):
                              backlog (last N MATCHING lines, default 20) + live
                              tail of NEW stream lines. THE DEFAULT IS EVERYTHING:
                              with no `kinds` every line is served — tokens
                              (delta: text + reasoning), input_context, tool_call
                              and tool_result (FULL args and FULL bodies),
                              activity (the liveness beats), housekeeping-tagged
                              cron/subagent/curator turns, the mirrored agent log
                              lines, turn/stream boundaries and completions.
                              `kinds` is an OPT-IN filter (delta kind for delta
                              lines, event name for every other line); `since`
                              resumes the live tail at an exact byte offset instead
                              of EOF. There is no stream.jsonl until the plugin is
                              loaded and a turn runs, so this replies 404 with a
                              clear message instead of an empty 200.
    
       Plain unframed bytes with Connection: close (no chunked encoding) on both
       tails; client disconnects close the socket immediately.
    
    Event schema — one JSON object per line in ``<log_dir>/events.jsonl``:
    
      common:  {"ts": <epoch float>, "conversation": "<session id>", "event": "<type>"}
      types:   "user" {text, reminder} | "thinking" {text} | "assistant" {text}
               "tool_call" {name, args} | "tool_result" {text, truncated, full_bytes}
               "session" {id, source, cwd} | "process_state" {state, processes}
    
    reminder semantics (Hermes): Hermes writes all user turns to state.db; the
    ``sessions.source`` column distinguishes where a conversation came from
    (api_server / cli / cron / subagent). Self-driven noise (cron jobs, subagent
    delegations) is tagged reminder:true so the transcript excludes it; real
    operator prompts (talk.sh interactive sessions) are reminder:false. See the
    KNOWN AMBIGUITY note in OBSERVABILITY.md — sessions with source='api_server'
    can be either a real operator at talk.sh or another agent calling the
    api_server, so the default mapping is configurable (``noisy_sources``).
    
    Config: /etc/watch-config/config.json if present; env WATCH_PORT / AGENT_NAME /
    DEPLOY_NAME override config. Defaults: log_dir /opt/data/watch, poll 2s,
    db /opt/data/state.db. Writes ONLY under log_dir. stdlib only.
    """
    
    import json
    import os
    import sqlite3
    import threading
    import time
    from collections import deque
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import socket
    from urllib.parse import parse_qs, urlsplit
    
    # ── Config ────────────────────────────────────────────────────────────────
    
    DEFAULTS = {
        "agent_name": "",
        "deploy_name": "",
        "watch_port": 8000,
        "poll_interval_sec": 2,
        "log_dir": "/opt/data/watch",
        "db_path": "/opt/data/state.db",
        "result_truncate_bytes": 4096,
        "capture": True,
        # sessions with a source in this set are treated as machine self-prompts
        # (reminder:true -> excluded from the transcript)
        "noisy_sources": ["cron", "subagent"],
        # ── Token-level stream tap (written by kube-scripts/watch_plugin/) ──────
        # The plugin is the only writer of stream.jsonl; the sidecar follows it
        # with its own persisted byte cursor (never backfills, exactly like the
        # messages.id cursor) to keep live stats for /status and to serve /stream.
        "stream_file": "",                       # default: <log_dir>/stream.jsonl
        "plugin_dir": "/opt/data/plugins/sudo-watch-stream",
    }
    
    CONFIG = dict(DEFAULTS)
    STATE = {
        "started": time.time(),
        "events_logged": 0,
        "last_event_ts": None,
        "current_conversation": None,
        "agent_container_up": False,
        "active": False,
        "last_process_state": None,  # "active" | "idle"
        "last_transcript_conv": None,  # conversation of the last transcript line
        # token stream (stream.jsonl) — updated by stream_tap_loop
        "stream": {
            "lines": 0,               # lines consumed since this sidecar started
            "bytes": 0,               # size of stream.jsonl at last poll
            "kinds": {},              # event/kind -> count
            "last_ts": None,          # ts of the last stream line consumed
            "last_delta_ts": None,    # ts of the last delta (token) consumed
            "last_delta_kind": None,  # "text" | "reasoning"
            "text_chars": 0,
            "reasoning_chars": 0,
            "active_turn_id": "",
            "turns": 0,
            "last_activity_ts": None,   # last liveness beat
            "last_phase": None,         # phase reported by the last beat
            "last_tool_ts": None,       # last tool_call / tool_result
            "last_log_ts": None,        # last mirrored agent log line
            "housekeeping_turns": 0,    # cron/subagent/curator turns seen
            "housekeeping_ids": [],     # their turn ids (bounded)
        },
    }
    _LOCK = threading.Lock()  # guards events.jsonl appends + STATE counters
    
    # One shared cursor map + ONE writer: the capture thread persists state.json,
    # the stream thread only marks keys dirty (they must never clobber each other).
    _WM_LOCK = threading.Lock()
    _WM = {}
    _WM_DIRTY = False
    
    
    def load_config():
        cfg = dict(DEFAULTS)
        try:
            with open("/etc/watch-config/config.json") as f:
                cfg.update(json.load(f))
        except (OSError, ValueError):
            pass
        if os.environ.get("WATCH_PORT"):
            try:
                cfg["watch_port"] = int(os.environ["WATCH_PORT"])
            except ValueError:
                pass
        if os.environ.get("AGENT_NAME"):
            cfg["agent_name"] = os.environ["AGENT_NAME"]
        if os.environ.get("DEPLOY_NAME"):
            cfg["deploy_name"] = os.environ["DEPLOY_NAME"]
        if os.environ.get("WATCH_LOG_DIR"):
            cfg["log_dir"] = os.environ["WATCH_LOG_DIR"]
        if os.environ.get("WATCH_DB"):
            cfg["db_path"] = os.environ["WATCH_DB"]
        if os.environ.get("WATCH_STREAM_FILE"):
            cfg["stream_file"] = os.environ["WATCH_STREAM_FILE"]
        if os.environ.get("WATCH_PLUGIN_DIR"):
            cfg["plugin_dir"] = os.environ["WATCH_PLUGIN_DIR"]
        CONFIG.clear()
        CONFIG.update(cfg)
    
    
    def events_path():
        return os.path.join(CONFIG["log_dir"], "events.jsonl")
    
    
    def transcript_path():
        return os.path.join(CONFIG["log_dir"], "transcript.txt")
    
    
    def state_path():
        return os.path.join(CONFIG["log_dir"], "state.json")
    
    
    def stream_path():
        """The plugin's token-level tape (see kube-scripts/watch_plugin/)."""
        return CONFIG["stream_file"] or os.path.join(CONFIG["log_dir"],
                                                     "stream.jsonl")
    
    
    def plugin_state_path():
        """plugin.json written by the plugin (its own liveness heartbeat)."""
        return os.path.join(CONFIG["log_dir"], "plugin.json")
    
    
    def plugin_manifest_path():
        return os.path.join(CONFIG["plugin_dir"], "plugin.yaml")
    
    
    def ensure_log_dir():
        try:
            os.makedirs(CONFIG["log_dir"], exist_ok=True)
        except OSError:
            pass  # unit tests monkeypatch paths; capture is best-effort
    
    
    def append_event(event):
        """Append one event dict to events.jsonl; update STATE counters."""
        line = json.dumps(event, ensure_ascii=False)
        with _LOCK:
            ensure_log_dir()
            with open(events_path(), "a") as f:
                f.write(line + "\n")
            STATE["events_logged"] += 1
            STATE["last_event_ts"] = event.get("ts")
    
    
    def append_transcript(event):
        """Append one human-readable line to transcript.txt (chat log).
    
        Only REAL operator prompts (reminder:false) and assistant replies are
        logged; thinking / tool_call / tool_result / session / process_state
        events and role=tool content are excluded (harness plumbing).
        Appends only — tail -f friendly, never rewrites.
        """
        etype = event.get("event")
        if etype == "user":
            if event.get("reminder"):
                return
            who = "You:"
        elif etype == "assistant":
            who = "Agent:"
        else:
            return
        text = event.get("text") or ""
        conv = event.get("conversation") or ""
        stamp = time.strftime("%Y-%m-%d %H:%M:%S", time.localtime(event.get("ts")))
        with _LOCK:
            ensure_log_dir()
            parts = []
            if conv and conv != STATE["last_transcript_conv"]:
                parts.append("--- conversation: %s ---\n" % conv)
            parts.append("[%s] %s %s\n\n" % (stamp, who, text))
            try:
                with open(transcript_path(), "a") as f:
                    f.write("".join(parts))
                STATE["last_transcript_conv"] = conv or STATE["last_transcript_conv"]
            except OSError:
                pass  # best-effort; events.jsonl is the source of truth
    
    
    # ── state.db capture (id-cursor poll — the byte-watermark equivalent) ─────
    
    def load_watermarks():
        """Persisted cursors: {'last_message_id': N, 'last_session_rowid': N}."""
        try:
            with open(state_path()) as f:
                loaded = json.load(f)
        except (OSError, ValueError):
            loaded = {}
        with _WM_LOCK:
            _WM.clear()
            _WM.update(loaded if isinstance(loaded, dict) else {})
            return _WM
    
    
    def mark_watermark(key, value):
        """Record one cursor value; the capture thread performs the flush."""
        global _WM_DIRTY
        with _WM_LOCK:
            if _WM.get(key) != value:
                _WM[key] = value
                _WM_DIRTY = True
    
    
    def save_watermarks_if_dirty():
        """Single writer for state.json (capture thread only)."""
        global _WM_DIRTY
        with _WM_LOCK:
            if not _WM_DIRTY:
                return
            snapshot = dict(_WM)
            _WM_DIRTY = False
        try:
            tmp = state_path() + ".tmp"
            with open(tmp, "w") as f:
                json.dump(snapshot, f)
            os.replace(tmp, state_path())
        except OSError:
            with _WM_LOCK:
                _WM_DIRTY = True
    
    
    # ── Token-level stream tap (stream.jsonl, written by the plugin) ───────────
    
    def _stream_kind_of(ev):
        """Filtering key for one stream line: delta kind, else the event name."""
        if ev.get("event") == "delta":
            return ev.get("kind") or "text"
        return ev.get("event") or "?"
    
    
    def _line_matches(raw, kinds):
        """Does a raw stream.jsonl line pass the ?kinds= filter?
    
        ``kinds=reasoning,text`` selects delta lines by kind; any event name
        (``turn_start``, ``input_context``, ``stream_end``, ``completion`` ...)
        selects that event; ``delta`` selects every delta line. An empty filter
        matches everything, and an unparsable line is passed through rather than
        silently dropped (never hide data because it confused us).
        """
        if not kinds:
            return True
        try:
            ev = json.loads(raw.decode("utf-8", "replace")
                            if isinstance(raw, (bytes, bytearray)) else raw)
        except ValueError:
            return True
        if not isinstance(ev, dict):
            return True
        if ev.get("event") == "delta":
            return ("delta" in kinds
                    or (ev.get("kind") or "text").lower() in kinds)
        return (ev.get("event") or "?").lower() in kinds
    
    
    def _stream_tap_once():
        """Consume new stream.jsonl lines from the persisted byte cursor.
    
        No backfill: on the very first pass the cursor is seeded to the CURRENT
        end-of-file, so only lines written after the sidecar started are counted
        (identical semantics to the messages.id seed in capture_once).
        """
        path = stream_path()
        try:
            size = os.path.getsize(path)
        except OSError:
            return  # plugin not loaded / no turn yet
        st = STATE["stream"]
        st["bytes"] = size
        with _WM_LOCK:
            off = _WM.get("stream_offset")
        if off is None:
            mark_watermark("stream_offset", size)
            return
        if size < off:  # rotated or truncated: restart, never re-read gaps
            off = 0
        if size <= off:
            return
        consumed = off
        try:
            with open(path, "rb") as f:
                f.seek(off)
                for raw in f:
                    if not raw.endswith(b"\n"):
                        break  # half-written line: wait for the writer's flush
                    consumed += len(raw)
                    try:
                        ev = json.loads(raw.decode("utf-8", "replace"))
                    except ValueError:
                        continue
                    if not isinstance(ev, dict):
                        continue
                    key = _stream_kind_of(ev)
                    st["lines"] += 1
                    st["kinds"][key] = st["kinds"].get(key, 0) + 1
                    ts = ev.get("ts")
                    if ts is not None:
                        st["last_ts"] = ts
                    if ev.get("event") == "delta":
                        st["last_delta_ts"] = ts
                        st["last_delta_kind"] = key
                        n = len(ev.get("delta") or "")
                        if key == "reasoning":
                            st["reasoning_chars"] += n
                        else:
                            st["text_chars"] += n
                    if ev.get("event") in ("turn_start", "input_context", "delta"):
                        if ev.get("turn_id"):
                            st["active_turn_id"] = ev["turn_id"]
                    if ev.get("event") == "turn_start":
                        st["turns"] += 1
                    if ev.get("housekeeping"):
                        # Count DISTINCT housekeeping turns. A cron/subagent turn
                        # never fires on_stream_start (it does not stream at all),
                        # so counting turn_start events reported 0 while the
                        # console was visibly rendering HOUSEKEEPING(cron) lines.
                        tid = ev.get("turn_id") or ""
                        if tid:
                            ids = st.setdefault("housekeeping_ids", [])
                            if tid not in ids:
                                ids.append(tid)
                                if len(ids) > 200:
                                    del ids[:100]
                                st["housekeeping_turns"] = len(ids)
                    if ev.get("event") == "activity":
                        st["last_activity_ts"] = ts
                        if ev.get("phase"):
                            st["last_phase"] = ev["phase"]
                    if ev.get("event") in ("tool_call", "tool_result"):
                        st["last_tool_ts"] = ts
                    if ev.get("event") == "log":
                        st["last_log_ts"] = ts
        except OSError:
            return
        if consumed != off:
            mark_watermark("stream_offset", consumed)
    
    
    def stream_tap_loop():
        while True:
            try:
                _stream_tap_once()
            except Exception:
                pass  # stats only; never let the tap kill the sidecar
            time.sleep(0.5)
    
    
    def _connect_ro():
        """Open the agent's SQLite store READ-ONLY (URI mode=ro).
    
        WAL mode lets a read-only connection coexist with the agent's writer.
        If the ro open fails (e.g. WAL needs recovery and no writer is up), fall
        back to a normal read-write open as a last resort — we still never
        write to the DB ourselves.
        """
        path = CONFIG["db_path"]
        try:
            return sqlite3.connect("file:%s?mode=ro" % path, uri=True)
        except sqlite3.Error:
            return sqlite3.connect(path)
    
    
    def _source_is_noisy(source, session_sources, session_id):
        """reminder flag for a user turn: is this session machine self-prompt?
    
        KNOWN AMBIGUITY (flagged to the operator): sessions.source on Hermes is
        'api_server' for BOTH real operator talk.sh sessions and other agents
        calling the api_server; 'subagent'/'cron' are reliably self-prompts.
        Default mapping: only cron/subagent are reminder:true. If a session's
        source is unknown, treat it as a real prompt (reminder:false).
        """
        src = session_sources.get(session_id)
        return src in CONFIG["noisy_sources"]
    
    
    def normalize_message_row(row, session_sources):
        """Turn one messages row into a list of events (may be empty).
    
        Row: (id, session_id, role, content, tool_name, tool_calls,
              reasoning_content, timestamp)
        Mapping (verified against a live sudo-agent pod's state.db):
          role='user'            -> user event (reminder from sessions.source)
          role='assistant':      -> thinking event (reasoning_content, if any)
                                   + tool_call events (tool_calls JSON, if any)
                                   + assistant event (content, if any)
          role='tool'            -> tool_result event (content; truncated)
        """
        (mid, session_id, role, content, tool_name, tool_calls,
         reasoning_content, ts) = row
        out = []
        # use the DB row timestamp when present; clock time otherwise
        try:
            ts = float(ts) if ts is not None else time.time()
        except (TypeError, ValueError):
            ts = time.time()
        common = {"ts": ts, "conversation": session_id}
        if role == "user":
            text = content or ""
            out.append(dict(common, event="user", text=text,
                            reminder=_source_is_noisy(None, session_sources,
                                                      session_id)))
        elif role == "assistant":
            if reasoning_content:
                out.append(dict(common, event="thinking",
                                text=reasoning_content))
            if tool_calls:
                try:
                    calls = json.loads(tool_calls)
                except (TypeError, ValueError):
                    calls = []
                if not isinstance(calls, list):
                    calls = []
                for call in calls:
                    if not isinstance(call, dict):
                        continue
                    fn = call.get("function") or {}
                    args = fn.get("arguments")
                    if isinstance(args, str):
                        try:
                            args = json.loads(args)
                        except ValueError:
                            pass  # keep raw string; better than dropping it
                    out.append(dict(common, event="tool_call",
                                    name=fn.get("name") or call.get("name"),
                                    args=args))
            if content:
                out.append(dict(common, event="assistant", text=content))
        elif role == "tool":
            text = content or ""
            full = len(text.encode("utf-8", "replace"))
            limit = int(CONFIG["result_truncate_bytes"])
            trunc = False
            if full > limit:
                text = text.encode("utf-8", "replace")[:limit].decode(
                    "utf-8", "replace")
                trunc = True
            out.append(dict(common, event="tool_result",
                            text=text, truncated=trunc, full_bytes=full,
                            name=tool_name))
        return out
    
    
    def capture_once(wm):
        """One poll pass over state.db; returns the new cursor dict (or {}).
    
        No backfill: on the very first pass (no persisted cursor) the cursors
        are seeded to the CURRENT max ids, so only post-deployment activity is
        logged — the exact semantics of the Letta byte watermarks.
        """
        changed = {}
        try:
            conn = _connect_ro()
        except sqlite3.Error:
            return changed
        try:
            conn.row_factory = sqlite3.Row
            cur = conn.cursor()
            # seed cursors if first run
            if "last_message_id" not in wm:
                row = cur.execute(
                    "SELECT COALESCE(MAX(id), 0) FROM messages").fetchone()
                wm["last_message_id"] = row[0]
                changed["last_message_id"] = row[0]
            if "last_session_rowid" not in wm:
                row = cur.execute(
                    "SELECT COALESCE(MAX(rowid), 0) FROM sessions").fetchone()
                wm["last_session_rowid"] = row[0]
                changed["last_session_rowid"] = row[0]
            # refresh session source map (for the reminder flag)
            session_sources = {}
            for r in cur.execute("SELECT id, source FROM sessions"):
                session_sources[r[0]] = r[1]
            # new sessions -> session events
            for r in cur.execute(
                    "SELECT rowid, id, source, cwd FROM sessions "
                    "WHERE rowid > ? ORDER BY rowid", (wm["last_session_rowid"],)):
                wm["last_session_rowid"] = r["rowid"]
                changed["last_session_rowid"] = r["rowid"]
                ev = {"ts": time.time(), "conversation": r["id"],
                      "event": "session", "id": r["id"],
                      "source": r["source"], "cwd": r["cwd"]}
                append_event(ev)
                STATE["current_conversation"] = r["id"]
                session_sources[r["id"]] = r["source"]
            # new messages -> user/thinking/assistant/tool_call/tool_result
            for row in cur.execute(
                    "SELECT id, session_id, role, content, tool_name, tool_calls, "
                    "reasoning_content, timestamp FROM messages "
                    "WHERE id > ? ORDER BY id", (wm["last_message_id"],)):
                wm["last_message_id"] = row[0]
                changed["last_message_id"] = row[0]
                session_id = row[1]
                if session_sources.get(session_id) is None:
                    r2 = cur.execute(
                        "SELECT source FROM sessions WHERE id = ?",
                        (session_id,)).fetchone()
                    session_sources[session_id] = r2[0] if r2 else None
                STATE["current_conversation"] = session_id
                for ev in normalize_message_row(tuple(row), session_sources):
                    append_event(ev)
                    append_transcript(ev)
        except sqlite3.Error:
            pass  # DB moved/locked/absent; retry next poll
        finally:
            try:
                conn.close()
            except Exception:
                pass
        return changed
    
    
    def capture_loop():
        wm = load_watermarks()
        while True:
            changed = capture_once(wm)
            for key, value in (changed or {}).items():
                mark_watermark(key, value)
            save_watermarks_if_dirty()
            time.sleep(0.5)
    
    
    # ── Process monitor ───────────────────────────────────────────────────────
    
    def _read_file(path):
        try:
            with open(path) as f:
                return f.read()
        except OSError:
            return ""
    
    
    def self_pid_tree():
        """Set of pids in our own tree (we + our threads + children)."""
        me = os.getpid()
        tree = {me}
        for entry in os.listdir("/proc"):
            if not entry.isdigit():
                continue
            ppid = _read_file("/proc/%s/stat" % entry).split(")")[-1].split()[1]
            try:
                if int(ppid) in tree:
                    tree.add(int(entry))
            except (IndexError, ValueError):
                pass
        return tree
    
    
    def poll_processes():
        """Return (agent_up, hermes_procs, all_procs) from one /proc scan."""
        mine = self_pid_tree()
        agent_up = False
        hermes_procs = []
        all_procs = []
        for entry in os.listdir("/proc"):
            if not entry.isdigit():
                continue
            pid = int(entry)
            if pid in mine:
                continue
            if pid == 1:
                continue  # pause container
            cmdline = _read_file("/proc/%s/cmdline" % entry).replace("\0", " ").strip()
            stat = _read_file("/proc/%s/stat" % entry)
            try:
                ppid = int(stat.split(")")[-1].split()[1])
            except (IndexError, ValueError):
                ppid = 0
            try:
                with open("/proc/%s/status" % entry) as f:
                    uid = int(next(l for l in f if l.startswith("Uid:")).split()[1])
            except (OSError, StopIteration, ValueError):
                uid = -1
            try:
                age = time.time() - os.path.getmtime("/proc/%s" % entry)
            except OSError:
                age = 0.0
            if not cmdline:
                # kernel threads shouldn't appear in a container, but be safe
                continue
            agent_up = True
            proc = {"pid": pid, "ppid": ppid, "uid": uid,
                    "age_s": round(age, 1), "cmdline": cmdline[:300]}
            all_procs.append(proc)
            if "hermes" in cmdline.lower():
                hermes_procs.append(proc)
        return agent_up, hermes_procs, all_procs
    
    
    def monitor_loop():
        interval = float(CONFIG["poll_interval_sec"])
        while True:
            agent_up, hermes_procs, all_procs = poll_processes()
            STATE["agent_container_up"] = agent_up
            active = bool(hermes_procs)
            STATE["active"] = active
            state_str = "active" if active else "idle"
            if state_str != STATE["last_process_state"]:
                STATE["last_process_state"] = state_str
                append_event({
                    "ts": time.time(),
                    "conversation": STATE["current_conversation"] or "",
                    "event": "process_state",
                    "state": state_str,
                    "processes": [{"pid": p["pid"], "cmdline": p["cmdline"]}
                                  for p in hermes_procs],
                })
            time.sleep(interval)
    
    
    def _file_size(path):
        try:
            return os.path.getsize(path)
        except OSError:
            return 0
    
    
    def _plugin_status():
        """What the sidecar can actually prove about the streaming plugin.
    
        ``installed`` = the manifest is on disk (ConfigMap mounted by up.sh);
        ``loaded``    = the plugin's register() actually ran (plugin.json, written
                        by the plugin itself);
        ``in_gateway``= that pid is ALIVE and its cmdline is the agent's gateway
                        process — the shared PID namespace makes this checkable,
                        which is why a plugin loaded by a throwaway CLI probe does
                        not masquerade as the live tap.
        """
        info = {
            "installed": os.path.isfile(plugin_manifest_path()),
            "manifest": plugin_manifest_path(),
            "state_file": plugin_state_path(),
            "loaded": False,
            "pid": None,
            "pid_alive": False,
            "in_gateway": False,
            "hooks_registered": [],
            "counts": {},
            "dropped": 0,
            "heartbeat_ts": None,
            "heartbeat_age_s": None,
        }
        try:
            with open(plugin_state_path()) as f:
                st = json.load(f)
        except (OSError, ValueError):
            st = None
        if isinstance(st, dict):
            info["loaded"] = bool(st.get("loaded"))
            info["hooks_registered"] = list(st.get("hooks") or [])
            info["phase"] = st.get("phase")
            info["log_capture"] = st.get("log_capture")
            info["counts"] = dict(st.get("counts") or {})
            info["dropped"] = st.get("dropped") or 0
            pid = st.get("pid")
            info["pid"] = pid
            ts = st.get("ts")
            if isinstance(ts, (int, float)):
                info["heartbeat_ts"] = ts
                info["heartbeat_age_s"] = round(time.time() - ts, 1)
            if isinstance(pid, int):
                info["pid_alive"] = os.path.exists("/proc/%d" % pid)
                if info["pid_alive"]:
                    cmd = _read_file("/proc/%d/cmdline" % pid).replace("\0", " ")
                    info["pid_cmdline"] = cmd.strip()[:200]
                    info["in_gateway"] = "gateway" in cmd and "hermes" in cmd.lower()
        return info
    
    
    def _stream_status():
        """Live stats for the token-level tape (updated by stream_tap_loop)."""
        st = STATE["stream"]
        path = stream_path()
        now = time.time()
        out = {
            "file": path,
            "exists": os.path.isfile(path),
            "bytes": st["bytes"],
            "lines": st["lines"],
            "kinds": dict(st["kinds"]),
            "last_ts": st["last_ts"],
            "last_delta_ts": st["last_delta_ts"],
            "last_delta_kind": st["last_delta_kind"],
            "text_chars": st["text_chars"],
            "reasoning_chars": st["reasoning_chars"],
            "active_turn_id": st["active_turn_id"],
            "turns": st["turns"],
            "last_activity_ts": st["last_activity_ts"],
            "last_phase": st["last_phase"],
            "last_tool_ts": st["last_tool_ts"],
            "last_log_ts": st["last_log_ts"],
            "housekeeping_turns": st["housekeeping_turns"],
            "plugin": _plugin_status(),
        }
        for key, name in (("last_ts", "age_s"), ("last_delta_ts", "delta_age_s"),
                          ("last_activity_ts", "activity_age_s"),
                          ("last_tool_ts", "tool_age_s"),
                          ("last_log_ts", "log_age_s")):
            ts = out[key]
            out[name] = round(now - ts, 1) if isinstance(ts, (int, float)) else None
        # silent_for_s is the "never silent" measurement: how long since ANY tape
        # line. With the activity watchdog alive this stays <= ~2s while a turn is
        # in flight, which is the whole contract.
        out["silent_for_s"] = out["age_s"]
        with _WM_LOCK:
            out["cursor_offset"] = _WM.get("stream_offset")
        return out
    
    
    # ── HTTP tap ──────────────────────────────────────────────────────────────
    
    class TapHandler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        server_version = "sudo-agent-watch/1.0"
    
        def log_message(self, fmt, *args):  # quiet
            pass
    
        def _send(self, code, body, ctype="text/plain; charset=utf-8"):
            data = body.encode("utf-8") if isinstance(body, str) else body
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)
    
        def _send_json(self, obj):
            self._send(200, json.dumps(obj, indent=2), "application/json")
    
        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path == "/healthz":
                self._send(200, "OK\n")
            elif path == "/status":
                self._send_json({
                    "agent": CONFIG["agent_name"],
                    "deploy": CONFIG["deploy_name"],
                    "uptime_s": round(time.time() - STATE["started"], 1),
                    "agent_container_up": STATE["agent_container_up"],
                    "active": STATE["active"],
                    "current_conversation": STATE["current_conversation"],
                    "last_event_ts": STATE["last_event_ts"],
                    "events_logged": STATE["events_logged"],
                    "transcript_bytes": _file_size(transcript_path()),
                    "watch_port": CONFIG["watch_port"],
                    "stream": _stream_status(),
                })
            elif path == "/ps":
                _, _, procs = poll_processes()
                self._send_json(procs)
            elif path == "/events":
                n = 100
                if "?" in self.path:
                    for pair in self.path.split("?", 1)[1].split("&"):
                        if pair.startswith("n="):
                            try:
                                n = int(pair[2:])
                            except ValueError:
                                pass
                try:
                    with open(events_path()) as f:
                        lines = f.readlines()
                except OSError:
                    lines = []
                self._send(200, "".join(lines[-n:]), "application/x-ndjson")
            elif path == "/stream":
                self.stream()
            elif path == "/events-stream":
                self.events_stream()
            else:
                self._send(404, "not found\n")
    
        def stream(self, backlog=20):
            """Live token stream: backlog dump + follow NEW stream.jsonl lines.
    
            Query params (all optional):
              ?n=<N>          backlog: the last N MATCHING lines (default 20, 0 to
                              skip; capped read window of the last 4 MB)
              ?kinds=a,b      filter: delta kind ("reasoning"/"text") for delta
                              lines, event name for every other line
              ?since=<offset> live-follow from this BYTE OFFSET instead of EOF
                              (the sidecar's own cursor is in /status ->
                              stream.cursor_offset, so a consumer can resume
                              exactly where the last one stopped; a bare ?since=
                              implies n=0 so a resume never replays a backlog)
    
            Carried over from the sudo-letta round-2 fixes (operator-reported
            bugs, do not relearn):
            - NO chunked transfer encoding: we write plain unframed bytes with
              ``Connection: close`` — curl -N renders incrementally and the
              connection simply ends when we finish/die.
            - Client-disconnect detection: every write+flush failure
              (BrokenPipeError / ConnectionResetError / any OSError on the socket)
              means the client is gone (e.g. Ctrl-C on curl); we catch it and close
              the socket immediately so no handler thread spins forever and no
              error spam piles up.
            """
            self.close_connection = True  # one request per connection; no keepalive
            params = parse_qs(urlsplit(self.path).query)
            # An explicit resume (?since=) means "carry on from there": do not also
            # dump a default backlog, which would replay lines the caller already
            # consumed. Ask for both explicitly to get backlog + resume.
            default_backlog = 0 if ("since" in params and "n" not in params) else backlog
            try:
                backlog = max(0, int((params.get("n") or [default_backlog])[0]))
            except (TypeError, ValueError):
                backlog = 0
            kinds = set()
            for raw in params.get("kinds", []):
                for part in str(raw).split(","):
                    part = part.strip().lower()
                    if part:
                        kinds.add(part)
            try:
                since = int((params.get("since") or [""])[0])
            except (TypeError, ValueError):
                since = None
            path = stream_path()
            try:
                f = open(path, "rb")
            except OSError:
                self._send(404, "no stream.jsonl yet (%s) — the sudo-watch-stream "
                                "plugin is not loaded, or no turn has run on this "
                                "agent yet\n" % path)
                return
            try:
                self.send_response(200)
                self.send_header("Content-Type", "application/x-ndjson")
                self.send_header("Connection", "close")
                self.end_headers()
                size = f.seek(0, 2)
                if backlog and size:
                    start = max(0, size - 4 * 1024 * 1024)
                    f.seek(start)
                    if start:
                        f.readline()  # drop the partial line at the window edge
                    selected = [ln for ln in f.readlines()
                                if _line_matches(ln, kinds)]
                    for line in selected[-backlog:]:
                        self.wfile.write(line)
                    self.wfile.flush()
                if since is not None:
                    pos = min(max(0, since), size)
                else:
                    pos = size  # live-follow: only NEW lines from here
                # Follow by re-opening at our own byte position each pass instead
                # of holding one handle at EOF: that is immune to any stale-EOF
                # buffering and picks up rotation/truncation for free. The `tail
                # -f` semantics are unchanged — only bytes we have not sent.
                while True:
                    moved = False
                    try:
                        size = os.path.getsize(path)
                    except OSError:
                        time.sleep(0.25)
                        continue
                    if size < pos:  # rotated/truncated: restart the follow
                        pos = 0
                    if size > pos:
                        with open(path, "rb") as follow:
                            follow.seek(pos)
                            for line in follow:
                                if not line.endswith(b"\n"):
                                    break  # half-written line; wait for the flush
                                pos += len(line)
                                moved = True
                                if _line_matches(line, kinds):
                                    self.wfile.write(line)
                                    self.wfile.flush()
                    if not moved:
                        time.sleep(0.25)
            except (BrokenPipeError, ConnectionResetError,
                    ConnectionAbortedError, OSError):
                pass  # client went away; fall through to cleanup
            finally:
                try:
                    f.close()
                except OSError:
                    pass
                # close the socket no matter how we got out, so the server thread
                # and the kernel connection are reclaimed immediately
                try:
                    self.connection.shutdown(socket.SHUT_RDWR)
                except OSError:
                    pass
                try:
                    self.connection.close()
                except OSError:
                    pass
    
    
        def events_stream(self, backlog=20):
            """Live tail of events.jsonl — the ORIGINAL /stream behaviour.
    
            Kept verbatim (now served at /events-stream) so the state.db-derived
            event tape keeps its old consumer contract while /stream became the
            token-level tape. Same unframed-bytes / Connection: close / instant
            client-disconnect handling as :meth:`stream`.
            """
            self.close_connection = True  # one request per connection; no keepalive
            try:
                self.send_response(200)
                self.send_header("Content-Type", "application/x-ndjson")
                self.send_header("Connection", "close")
                self.end_headers()
                with open(events_path()) as f:
                    if backlog:
                        # on-connect backlog dump of the most recent events
                        for line in deque(f, maxlen=backlog):
                            self.wfile.write(line.encode("utf-8", "replace"))
                        self.wfile.flush()
                    f.seek(0, 2)  # live-follow: only NEW events from here
                    while True:
                        line = f.readline()
                        if line:
                            self.wfile.write(line.encode("utf-8", "replace"))
                            self.wfile.flush()
                        else:
                            time.sleep(0.5)
            except (BrokenPipeError, ConnectionResetError,
                    ConnectionAbortedError, OSError):
                pass  # client went away; fall through to cleanup
            finally:
                # close the socket no matter how we got out, so the server thread
                # and the kernel connection are reclaimed immediately
                try:
                    self.connection.shutdown(socket.SHUT_RDWR)
                except OSError:
                    pass
                try:
                    self.connection.close()
                except OSError:
                    pass
    
    
    def http_server():
        srv = ThreadingHTTPServer(("0.0.0.0", int(CONFIG["watch_port"])), TapHandler)
        srv.daemon_threads = True
        srv.serve_forever()
    
    
    # ── Main ─────────────────────────────────────────────────────────────────
    
    def main():
        load_config()
        os.makedirs(CONFIG["log_dir"], exist_ok=True)
        threads = [
            threading.Thread(target=capture_loop, daemon=True),
            threading.Thread(target=stream_tap_loop, daemon=True),
            threading.Thread(target=monitor_loop, daemon=True),
            threading.Thread(target=http_server, daemon=True),
        ]
        for t in threads:
            t.start()
        # keep the main thread alive; if a worker dies, exit so k3s restarts us
        while True:
            if not all(t.is_alive() for t in threads):
                raise SystemExit("worker thread died")
            time.sleep(5)
    
    
    if __name__ == "__main__":
        main()
  config.json: |
    {
      "agent_name": "caesar",
      "deploy_name": "sudo-caesar",
      "watch_port": 15885,
      "poll_interval_sec": 2,
      "log_dir": "/opt/data/watch",
      "db_path": "/opt/data/state.db",
      "stream_file": "/opt/data/watch/stream.jsonl",
      "plugin_dir": "/opt/data/plugins/sudo-watch-stream",
      "noisy_sources": ["cron", "subagent"]
    }
---
# ── Token-level stream plugin (mounted into BOTH containers) ────────────────
# The agent container loads it from /opt/data/plugins/sudo-watch-stream (the
# user plugin dir for HERMES_HOME=/opt/data); the watch container gets the same
# path so stream.sh and /status can prove the plugin is really installed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sudo-caesar-watch-plugin
  labels:
    app: sudo-agent
    agent: caesar
data:
  plugin.yaml: |
    name: sudo-watch-stream
    version: "1.1.0"
    description: "Whole-runtime live streaming tap for sudo-agent pods: every reasoning/answer delta, the full pre-request input context, FULL tool arguments and FULL tool results, liveness/activity beats that guarantee the console is never silently frozen, housekeeping (cron/subagent/curator) turns tagged instead of suppressed, and the agent's own log lines mirrored in — all appended to <HERMES_HOME>/watch/stream.jsonl so the watch sidecar can tail it live. Observer-only, stdlib-only, never raises into the agent."
    author: sudo-agent-maintainer
    kind: standalone
    hooks:
      - on_stream_start
      - on_stream_delta
      - on_stream_end
      - pre_api_request
      - post_api_request
      - pre_tool_call
      - post_tool_call
  __init__.py: |
    """sudo-watch-stream — token-level live streaming tap for a sudo-agent pod.
    
    WHY THIS EXISTS
    ---------------
    The observer sidecar (``kube-scripts/watch_sidecar.py``) polls the agent's
    SQLite store (``/opt/data/state.db``). Hermes only writes a message row when a
    turn is COMPLETE, so the sidecar can never show a token before the model has
    finished it — per-token granularity is impossible from state.db by
    construction. This plugin is the real-time tap: it registers Hermes' native
    plugin stream hooks and writes every chunk the model emits, plus the full input
    context it is about to send, to
    
        <HERMES_HOME>/watch/stream.jsonl
    
    one JSON object per line, as it happens. The sidecar tails that file (see its
    ``/stream`` endpoint); ``kube-scripts/stream.sh`` reads it directly with
    ``kubectl exec ... tail -f``.
    
    EVENT SCHEMA (all lines carry ``ts`` (epoch float) and a monotonic ``seq``)
    ----------------------------------------------------------------------------
      {"event": "plugin_state",  state, hooks, log_dir, pid}
      {"event": "turn_start",    turn_id, iteration, session_id, model, provider,
                                 surface}
      {"event": "input_context", turn_id, api_call_count, api_request_id,
                                 session_id, model, provider, api_mode, platform,
                                 message_count, tool_count, approx_input_tokens,
                                 request_char_count, max_tokens, messages,
                                 request_body, system_prompt, user_message}
      {"event": "delta",         kind: "text"|"reasoning", delta, turn_id,
                                 iteration, session_id, model, provider, surface,
                                 text_chars, reasoning_chars}
      {"event": "stream_end",    turn_id, iteration, final_text, finished, error,
                                 text_chars, reasoning_chars, delta_count,
                                 synthesized (only on a never-streamed call)}
      {"event": "completion",    turn_id, api_call_count, finish_reason,
                                 api_duration, response_model, usage,
                                 assistant_content_chars,
                                 assistant_tool_call_count, streamed, text}
      {"event": "tool_call",     tool, args (FULL, no truncation), args_chars,
                                 tool_call_id, turn_id, session_id,
                                 api_request_id, task_id}
      {"event": "tool_result",   tool, args, result (FULL, no truncation),
                                 result_chars, status, error_type, error_message,
                                 duration_ms, tool_call_id, turn_id, session_id}
      {"event": "activity",      phase, reason, tool, phase_since, phase_elapsed,
                                 beat: "phase"|"heartbeat"|"idle", idle_for}
      {"event": "log",           stream ("agent.log"|"gateway.log"), level, line}
    
    ``completion`` exists for the paths that never stream (a provider that refuses
    SSE, copilot-acp, a MoA facade without consumers): ``pre_api_request`` and
    ``post_api_request`` still fire there, so the operator still gets the input
    context and, when nothing streamed, the finished answer text. Those calls also
    get a ``stream_end`` with ``synthesized: true`` and ``delta_count: 0``, so a
    consumer can close the turn it saw an ``input_context`` for (the runtime only
    fires ``on_stream_end`` on the streaming path).
    
    THE WHOLE RUNTIME, NOT JUST TOKENS
    ----------------------------------
    The tape and the console carry the SAME level of detail. Verbose by default is
    the product here, not a bug. Beyond the tokens this tape records:
    
    * ``tool_call`` / ``tool_result`` from ``pre_tool_call`` / ``post_tool_call``,
      with FULL arguments and FULL result bodies. Nothing is truncated by default;
      ``SUDO_WATCH_TOOL_MAX_CHARS`` can impose a cap if an operator ever wants one.
    * ``activity`` — the liveness beats that close the "silently waiting" gap. The
      model emits NO text at all while it is generating tool-call arguments (the
      ``_fire_tool_gen_started`` window), while a tool is running, and while the
      provider has not yet produced its first token. So the plugin keeps a phase
      machine (idle / turn_active / provider_wait / generating_reasoning /
      generating_text / tool_args / tool_running / tool_result) and a watchdog that
      re-emits the current phase at least every ``SUDO_WATCH_ACTIVITY_EVERY_SEC``
      (default 2 s) for as long as a turn is in flight, plus a slow idle beat
      (``SUDO_WATCH_IDLE_EVERY_SEC``, default 30 s) so an armed-but-idle agent still
      shows life. Phase transitions always emit immediately. The contract: from the
      console alone the operator can never be left staring at a silent screen while
      the agent is doing something.
    * ``housekeeping`` — cron / subagent / curator / auxiliary turns are RECORDED
      and SHOWN, tagged ``housekeeping: true`` + ``housekeeping_reason`` so a
      consumer can filter them, instead of being suppressed the way transcript.txt
      suppresses them. Detection is a surface/platform heuristic
      (``SUDO_WATCH_HOUSEKEEPING_SURFACES``) because Hermes does not label an
      auxiliary call as such at the hook boundary; the raw ``surface``/``platform``
      always ride on the event too, so nothing is hidden behind the guess.
    * ``log`` — the agent's own log files (``agent.log``, ``gateway.log``) are
      mirrored in from EOF, so errors, warnings and retries appear in the same feed
      as the tokens.
    
    HARD RULES (a plugin must never hurt the agent it observes)
    -----------------------------------------------------------
    * Every callback is wrapped in try/except and never raises.
    * ``pre_api_request`` fires INLINE on the request path (conversation_loop calls
      ``lifecycle.invoke_hook`` directly), so that callback only builds a small dict
      of references and queue-puts it. All JSON serialisation, truncation and file
      I/O happen on a separate daemon writer thread.
    * The queue is bounded and DROPS THE OLDEST item when full: a slow disk must
      never throttle or block the model.
    * Deltas are written with an immediate flush, so the sidecar/``tail -f`` sees
      each chunk as it is produced.
    * stdlib only; no imports from the repo; additive — nothing here mutates agent
      state, the DB, events.jsonl or transcript.txt.
    
    Config (env overrides, all optional):
      SUDO_WATCH_STREAM_DIR        default <HERMES_HOME>/watch  (== /opt/data/watch)
      SUDO_WATCH_CONTEXT_MAX_CHARS default 60000   (cap for one input_context)
      SUDO_WATCH_DELTA_MAX_CHARS   default 16384   (cap for one delta chunk)
      SUDO_WATCH_ACTIVITY_EVERY_SEC default 2.0    (never-silent beat cadence)
      SUDO_WATCH_IDLE_EVERY_SEC    default 30.0    (idle heartbeat; 0 disables)
      SUDO_WATCH_TOOL_MAX_CHARS    default 0       (0 = FULL args/results)
      SUDO_WATCH_LOG_CAPTURE       default 1       (mirror agent.log/gateway.log)
      SUDO_WATCH_LOG_FILES         default agent.log,gateway.log
      SUDO_WATCH_LOG_LINE_MAX_CHARS default 0      (0 = full log lines)
      SUDO_WATCH_HOUSEKEEPING_SURFACES default cron,subagent,curator,...
    """
    
    from __future__ import annotations
    
    import itertools
    import json
    import os
    import queue
    import re
    import threading
    import time
    
    PLUGIN_NAME = "sudo-watch-stream"
    
    DEFAULT_HOME = "/opt/data"
    CONTEXT_MAX_CHARS = int(os.environ.get("SUDO_WATCH_CONTEXT_MAX_CHARS") or 60000)
    DELTA_MAX_CHARS = int(os.environ.get("SUDO_WATCH_DELTA_MAX_CHARS") or 16384)
    QUEUE_MAX = 20000
    STATE_EVERY_SEC = 2.0
    MAX_PREVIEW = 160
    MAX_MESSAGE_ENTRIES = 400
    
    # ── whole-runtime capture (the AMENDMENT: log == console level of detail) ──
    # ACTIVITY_EVERY_SEC is the never-silent contract: while a turn is in flight
    # the writer emits an ``activity`` beat at least this often, so the console can
    # never sit silent for longer than ~ACTIVITY_EVERY_SEC while the agent works.
    ACTIVITY_EVERY_SEC = float(os.environ.get("SUDO_WATCH_ACTIVITY_EVERY_SEC") or 2.0)
    # Slow idle heartbeat so an armed-but-quiet agent still shows signs of life.
    # 0 disables the idle beat.
    IDLE_EVERY_SEC = float(os.environ.get("SUDO_WATCH_IDLE_EVERY_SEC") or 30.0)
    # FULL tool args / results by default. A positive int bounds a pathological
    # body and sets the *_truncated flags on the event.
    TOOL_MAX_CHARS = int(os.environ.get("SUDO_WATCH_TOOL_MAX_CHARS") or 0)
    # Mirror the agent's own log files into the tape.
    LOG_CAPTURE = (os.environ.get("SUDO_WATCH_LOG_CAPTURE") or "1").strip().lower() \
        not in ("0", "false", "no", "off")
    LOG_TAIL_FILES = tuple(f.strip() for f in
                           (os.environ.get("SUDO_WATCH_LOG_FILES")
                            or "agent.log,gateway.log").split(",") if f.strip())
    LOG_LINE_MAX_CHARS = int(os.environ.get("SUDO_WATCH_LOG_LINE_MAX_CHARS") or 0)
    # Surfaces that are NOT an operator conversation. Heuristic by necessity; see
    # the module docstring. Override with a comma list in the env if the fleet
    # grows a new non-operator surface.
    HOUSEKEEPING_SURFACES = {"cron", "subagent", "curator", "aux", "auxiliary",
                             "memory_review", "title_generation", "kanban"}
    _hk_env = os.environ.get("SUDO_WATCH_HOUSEKEEPING_SURFACES")
    if _hk_env:
        HOUSEKEEPING_SURFACES = set(x.strip().lower() for x in _hk_env.split(",")
                                    if x.strip())
    _LOG_LEVEL_RE = re.compile(
        r"\b(TRACE|DEBUG|INFO|WARNING|WARN|ERROR|CRITICAL|FATAL)\b")
    
    _seq = itertools.count(1)
    _queue: "queue.Queue[dict]" = queue.Queue(maxsize=QUEUE_MAX)
    _started = False
    _start_lock = threading.Lock()
    _state_lock = threading.Lock()
    _state = {
        "loaded": False,
        "pid": os.getpid(),
        "started": time.time(),
        "hooks": [],
        "counts": {},
        "dropped": 0,
        "last_event_ts": None,
        "active_turn_id": "",
        "turns": {},  # (turn_id, iteration) -> {"delta_count", "text_chars", "reasoning_chars"}
        # activity / never-silent state (written by the hooks, read by the watchdog)
        "phase": "idle",
        "phase_since": None,
        "phase_tool": "",
        "phase_beats": 0,
        "last_beat_ts": 0.0,
        "hk": {"housekeeping": False, "reason": ""},
    }
    _LOG_DIR = ""
    
    
    # ── paths / small helpers ─────────────────────────────────────────────────
    
    def log_dir() -> str:
        """Resolve the watch dir lazily (HERMES_HOME is authoritative)."""
        global _LOG_DIR
        if _LOG_DIR:
            return _LOG_DIR
        override = os.environ.get("SUDO_WATCH_STREAM_DIR")
        if override:
            _LOG_DIR = override
            return _LOG_DIR
        home = os.environ.get("HERMES_HOME") or DEFAULT_HOME
        try:  # canonical resolver when the plugin runs inside a Hermes process
            from hermes_constants import get_hermes_home  # type: ignore
    
            home = str(get_hermes_home())
        except Exception:
            pass
        _LOG_DIR = os.path.join(home, "watch")
        return _LOG_DIR
    
    
    def stream_path() -> str:
        return os.path.join(log_dir(), "stream.jsonl")
    
    
    def state_path() -> str:
        return os.path.join(log_dir(), "plugin.json")
    
    
    def _count(name: str, n: int = 1) -> None:
        """Best-effort counter bump. Never raises (this is the error path too)."""
        try:
            c = _state["counts"]
            c[name] = int(c.get(name, 0)) + n
        except Exception:
            pass
    
    
    def _counts_snapshot() -> dict:
        with _state_lock:
            return dict(_state["counts"])
    
    
    def _turn_key(turn_id, iteration):
        return "%s|%s" % (turn_id or "", iteration if iteration is not None else "")
    
    
    def _enqueue(ev: dict) -> None:
        """Queue one event for the writer thread. NEVER blocks; drops oldest."""
        ev["ts"] = time.time()
        ev["seq"] = next(_seq)
        try:
            _queue.put_nowait(ev)
            return
        except queue.Full:
            pass
        try:  # drop the oldest, then retry once
            _queue.get_nowait()
            with _state_lock:
                _state["dropped"] = int(_state["dropped"]) + 1
        except Exception:
            pass
        try:
            _queue.put_nowait(ev)
        except Exception:
            _count("dropped_events")
    
    
    def _turn_fields(kw: dict) -> dict:
        return {
            "turn_id": kw.get("turn_id") or "",
            "iteration": kw.get("iteration"),
            "session_id": kw.get("session_id") or "",
            "model": kw.get("model") or "",
            "provider": kw.get("provider") or "",
            "surface": kw.get("surface") or "",
        }
    
    
    # ── housekeeping tagging (recorded AND shown, never suppressed) ───────────
    
    def _housekeeping_tag(surface="", platform=""):
        """(bool, reason) for "this is a background turn, not the operator"."""
        hay = ("%s %s" % (surface or "", platform or "")).lower()
        for s in sorted(HOUSEKEEPING_SURFACES):
            if s and s in hay:
                return True, s
        return False, ""
    
    
    def _hk_update(surface="", platform="") -> None:
        hk, reason = _housekeeping_tag(surface, platform)
        try:
            with _state_lock:
                _state["hk"] = {"housekeeping": hk, "reason": reason}
        except Exception:
            pass
    
    
    def _hk_fields() -> dict:
        try:
            with _state_lock:
                hk = dict(_state["hk"])
        except Exception:
            return {"housekeeping": False, "housekeeping_reason": ""}
        return {"housekeeping": bool(hk.get("housekeeping")),
                "housekeeping_reason": hk.get("reason") or ""}
    
    
    # ── activity phase machine ────────────────────────────────────────────────
    
    _PHASE_REASON = {
        "provider_wait": "blocked on the provider (no first token yet)",
        "generating_reasoning": "generating reasoning",
        "generating_text": "generating answer text",
        "tool_args": "generating tool-call arguments",
        "tool_running": "blocked inside a tool call",
        "tool_result": "tool returned; the model is reading the result",
        "turn_active": "turn in flight",
        "idle": "idle",
    }
    
    
    def _set_phase(phase, tool="", **extra) -> None:
        """Record a phase transition; emit the beat when it actually changed."""
        try:
            now = time.time()
            with _state_lock:
                changed = (_state["phase"] != phase
                           or _state["phase_tool"] != (tool or ""))
                _state["phase"] = phase
                _state["phase_tool"] = tool or ""
                # Refresh the ACTIVE TURN from any hook that knows it. A turn spans
                # several API calls — on_stream_end fires per API CALL, not per turn
                # — so the id has to survive the mid-turn stream ends. Without this
                # the watchdog beats come out with turn_id "" and the beats that
                # carry a long/blocking tool call cannot be attributed to the turn
                # they belong to (measured: five consecutive ~2s
                # "blocked inside a tool call" beats, all turn_id "").
                tid = extra.get("turn_id")
                if tid:
                    _state["active_turn_id"] = tid
                if changed:
                    _state["phase_since"] = now
                    _state["phase_beats"] = 0
                    _state["last_beat_ts"] = now
                since = _state["phase_since"] or now
            if not changed:
                return
            ev = {"event": "activity", "phase": phase, "tool": tool or "",
                  "reason": _PHASE_REASON.get(phase, phase), "beat": "phase",
                  "phase_since": since,
                  "phase_elapsed": round(max(0.0, now - since), 3)}
            ev.update(_hk_fields())
            ev.update(extra or {})
            _enqueue(ev)
        except Exception:
            _count("activity_errors")
    
    
    def _activity_loop() -> None:
        """Re-emit the current phase so the screen is never silently frozen.
    
        While a turn is in flight the beat cadence is ACTIVITY_EVERY_SEC; when idle
        it slows to IDLE_EVERY_SEC. Beats are skipped when real events are already
        flowing, so a token stream is not polluted with heartbeats — the watchdog
        only speaks when the writer has been quiet.
        """
        while True:
            try:
                time.sleep(0.5)
                now = time.time()
                with _state_lock:
                    phase = _state["phase"]
                    tool = _state["phase_tool"]
                    since = _state["phase_since"] or now
                    last_event = _state["last_event_ts"] or 0.0
                    last_beat = _state["last_beat_ts"] or 0.0
                    beats = int(_state["phase_beats"] or 0)
                    turn_id = _state["active_turn_id"] or ""
                idle = phase in ("idle", "", "turn_end")
                period = IDLE_EVERY_SEC if idle else ACTIVITY_EVERY_SEC
                if period <= 0:
                    continue
                # back off a long-lived phase so an abandoned turn cannot write a
                # beat line every 2 s forever
                if not idle and beats > 300:
                    period = max(period, 15.0)
                quiet_for = now - max(last_event, last_beat)
                if quiet_for < period:
                    continue
                with _state_lock:
                    _state["last_beat_ts"] = now
                    _state["phase_beats"] = int(_state["phase_beats"] or 0) + 1
                ev = {"event": "activity", "phase": phase, "tool": tool,
                      "turn_id": turn_id,
                      "reason": _PHASE_REASON.get(phase, phase),
                      "beat": "idle" if idle else "heartbeat",
                      "phase_since": since,
                      "phase_elapsed": round(max(0.0, now - since), 3),
                      "idle_for": (round(max(0.0, now - last_event), 3)
                                   if last_event else None)}
                ev.update(_hk_fields())
                _enqueue(ev)
            except Exception:
                _count("activity_errors")
                time.sleep(0.5)
    
    
    # ── FULL-body serialisation (tool args / results, log lines) ─────────────
    
    def _full_json(value, cap=0):
        """(jsonable_value, truncated). cap=0 means NO truncation (the default)."""
        if value is None:
            return None, False
        if cap and cap > 0:
            data, trunc, _text = _bound_json(value, cap)
            return data, bool(trunc)
        if isinstance(value, str):
            return value, False
        try:
            return json.loads(json.dumps(value, ensure_ascii=False, default=str)), False
        except Exception:
            try:
                return str(value), True
            except Exception:
                return None, True
    
    
    def _chars_of(value) -> int:
        try:
            if isinstance(value, str):
                return len(value)
            return len(json.dumps(value, ensure_ascii=False, default=str))
        except Exception:
            return 0
    
    
    # ── the agent's own log files, mirrored in ────────────────────────────────
    
    def _log_candidates():
        home = os.environ.get("HERMES_HOME") or DEFAULT_HOME
        out = []
        for name in LOG_TAIL_FILES:
            path = name if os.path.isabs(name) else os.path.join(home, "logs", name)
            out.append((name, path))
        return out
    
    
    def _log_level(line: str) -> str:
        try:
            m = _LOG_LEVEL_RE.search(line[:220])
            return m.group(1) if m else ""
        except Exception:
            return ""
    
    
    def _logtail_loop() -> None:
        """Mirror agent.log / gateway.log into the tape. No backfill: start at EOF."""
        offsets = {}
        while True:
            try:
                time.sleep(1.0)
                for name, path in _log_candidates():
                    try:
                        size = os.path.getsize(path)
                    except OSError:
                        continue
                    off = offsets.get(path)
                    if off is None:
                        offsets[path] = size          # first sight: start at EOF
                        continue
                    if size < off:                     # rotated/truncated
                        off = 0
                    if size <= off:
                        continue
                    try:
                        with open(path, "rb") as f:
                            f.seek(off)
                            data = f.read()
                    except OSError:
                        continue
                    if not data:
                        continue
                    nl = data.rfind(b"\n")
                    if nl < 0:
                        continue                       # half-written line; wait
                    chunk, _rest = data[:nl + 1], data[nl + 1:]
                    offsets[path] = off + len(chunk)
                    for raw in chunk.splitlines():
                        line = raw.decode("utf-8", "replace")
                        if not line.strip():
                            continue
                        if LOG_LINE_MAX_CHARS and len(line) > LOG_LINE_MAX_CHARS:
                            line = line[:LOG_LINE_MAX_CHARS] + "\u2026[truncated]"
                        _enqueue({"event": "log", "stream": name, "file": path,
                                  "level": _log_level(line), "line": line})
            except Exception:
                _count("logtail_errors")
                time.sleep(1.0)
    
    
    # ── bounding helpers (JSON stays VALID, size stays bounded) ───────────────
    
    def _bound_walk(value, str_cap, max_items=MAX_MESSAGE_ENTRIES, depth=0):
        """Return (bounded_value, truncated_bool): caps strings and containers."""
        if depth > 8:
            return "<depth-limit>", True
        if value is None or isinstance(value, (bool, int, float)):
            return value, False
        if isinstance(value, str):
            if len(value) > str_cap:
                return value[:str_cap] + "…[truncated]", True
            return value, False
        if isinstance(value, dict):
            out, trunc = {}, False
            for i, (k, v) in enumerate(value.items()):
                if i >= max_items:
                    trunc = True
                    break
                sk = k if isinstance(k, str) else str(k)
                if len(sk) > 200:
                    sk = sk[:200]
                    trunc = True
                bv, t = _bound_walk(v, str_cap, max_items, depth + 1)
                out[sk] = bv
                trunc = trunc or t
            return out, trunc
        if isinstance(value, (list, tuple)):
            out, trunc = [], False
            for i, v in enumerate(list(value)):
                if i >= max_items:
                    trunc = True
                    break
                bv, t = _bound_walk(v, str_cap, max_items, depth + 1)
                out.append(bv)
                trunc = trunc or t
            return out, trunc
        try:
            s = str(value)
        except Exception:
            return "<unserialisable>", True
        return (s[:str_cap] + "…[truncated]" if len(s) > str_cap else s), len(s) > str_cap
    
    
    def _bound_json(value, max_chars: int):
        """Bound *value* so ``json.dumps`` of the result fits ``max_chars``."""
        last = None
        for str_cap in (8000, 2000, 500, 120, 30):
            data, trunc = _bound_walk(value, str_cap)
            try:
                text = json.dumps(data, ensure_ascii=False)
            except Exception:
                return "<unserialisable>", True, "null"
            last = (data, trunc, text)
            if len(text) <= max_chars:
                return last
        data, trunc, text = last
        return {"_oversize": True, "preview": text[:max(0, max_chars - 40)]}, True, text
    
    
    def _message_summary(messages) -> list:
        """Role + size + short preview per message — cheap, no full payload copy."""
        out = []
        if not isinstance(messages, list):
            return out
        for i, m in enumerate(messages):
            if i >= MAX_MESSAGE_ENTRIES:
                out.append({"i": i, "role": "<more>", "truncated": True})
                break
            if not isinstance(m, dict):
                out.append({"i": i, "role": "?", "chars": 0, "bytes": 0})
                continue
            content = m.get("content")
            if isinstance(content, list):
                try:
                    text = json.dumps(content, ensure_ascii=False)
                except Exception:
                    text = str(content)
            elif isinstance(content, str):
                text = content
            elif content is None:
                text = ""
            else:
                text = str(content)
            extra = ""
            if m.get("tool_calls"):
                try:
                    extra = " tool_calls=%d" % len(m["tool_calls"])
                except Exception:
                    extra = " tool_calls=?"
            out.append({
                "i": i,
                "role": m.get("role") or "?",
                "chars": len(text),
                "bytes": len(text.encode("utf-8", "replace")),
                "extra": extra,
                "preview": text[:MAX_PREVIEW],
            })
        return out
    
    
    def _materialize_context(ev: dict) -> None:
        """Expand a queued input_context in the WRITER thread (never inline)."""
        raw = ev.pop("_raw", None) or {}
        req = raw.get("request")
        body, trunc, _text = _bound_json(req, CONTEXT_MAX_CHARS)
        ev["request_body"] = body
        ev["request_body_truncated"] = trunc
    
        msgs = None
        if isinstance(req, dict):
            inner = req.get("body")
            if isinstance(inner, dict) and isinstance(inner.get("messages"), list):
                msgs = inner["messages"]
            elif isinstance(req.get("messages"), list):
                msgs = req["messages"]
        if msgs is None:
            for key in ("request_messages", "conversation_history"):
                cand = raw.get(key)
                if isinstance(cand, list) and cand:
                    msgs = cand
                    break
        ev["messages"] = _message_summary(msgs or [])
    
        sys_prompt, sys_trunc, _t = _bound_json(raw.get("system_prompt") or "",
                                                max(2000, CONTEXT_MAX_CHARS // 2))
        ev["system_prompt"] = sys_prompt
        ev["system_prompt_truncated"] = sys_trunc
        user_msg, um_trunc, _t = _bound_json(raw.get("user_message") or "",
                                             max(1000, CONTEXT_MAX_CHARS // 4))
        ev["user_message"] = user_msg
        ev["user_message_truncated"] = um_trunc
    
    
    # ── writer thread ─────────────────────────────────────────────────────────
    
    def _write_state() -> None:
        """Atomically publish plugin.json (the sidecar's liveness signal)."""
        try:
            with _state_lock:
                snap = {
                    "plugin": PLUGIN_NAME,
                    "loaded": bool(_state["loaded"]),
                    "pid": _state["pid"],
                    "started": _state["started"],
                    "hooks": list(_state["hooks"]),
                    "counts": dict(_state["counts"]),
                    "dropped": int(_state["dropped"]),
                    "last_event_ts": _state["last_event_ts"],
                    "active_turn_id": _state["active_turn_id"],
                    "phase": _state["phase"],
                    "phase_since": _state["phase_since"],
                    "last_beat_ts": _state["last_beat_ts"],
                    "log_capture": LOG_CAPTURE,
                    "stream_file": stream_path(),
                    "ts": time.time(),
                }
            path = state_path()
            tmp = path + ".tmp.%d" % os.getpid()
            with open(tmp, "w", encoding="utf-8") as f:
                json.dump(snap, f, ensure_ascii=False)
            os.replace(tmp, path)
        except Exception:
            _count("state_write_errors")
    
    
    def _writer() -> None:
        fh = None
        last_state = 0.0
        while True:
            try:
                ev = _queue.get(timeout=1.0)
            except queue.Empty:
                # Idle: still refresh plugin.json so the sidecar can tell a live
                # (loaded, quiet) plugin from a dead one. Without the timeout the
                # thread would block in get() forever and never heartbeat.
                now = time.time()
                if now - last_state >= STATE_EVERY_SEC:
                    last_state = now
                    _write_state()
                continue
            except Exception:
                time.sleep(0.1)
                continue
            try:
                if ev.get("event") == "input_context":
                    _materialize_context(ev)
                line = json.dumps(ev, ensure_ascii=False)
                if fh is None:
                    os.makedirs(log_dir(), exist_ok=True)
                    fh = open(stream_path(), "a", encoding="utf-8", errors="replace")
                fh.write(line + "\n")
                fh.flush()
                with _state_lock:
                    _state["last_event_ts"] = ev.get("ts")
                    if ev.get("event") == "turn_start":
                        _state["active_turn_id"] = ev.get("turn_id") or ""
                _count(ev.get("event") or "unknown")
            except Exception:
                _count("write_errors")
                try:
                    if fh is not None:
                        fh.close()
                except Exception:
                    pass
                fh = None
                time.sleep(0.05)
            now = time.time()
            if now - last_state >= STATE_EVERY_SEC:
                last_state = now
                _write_state()
    
    
    def _start() -> None:
        global _started
        with _start_lock:
            if _started:
                return
            _started = True
        try:
            os.makedirs(log_dir(), exist_ok=True)
        except Exception:
            pass
        t = threading.Thread(target=_writer, name="sudo-watch-stream-writer",
                             daemon=True)
        t.start()
        t = threading.Thread(target=_activity_loop,
                             name="sudo-watch-stream-activity", daemon=True)
        t.start()
        if LOG_CAPTURE:
            t = threading.Thread(target=_logtail_loop,
                                 name="sudo-watch-stream-logtail", daemon=True)
            t.start()
    
    
    # ── hook callbacks (all must be fast and must never raise) ────────────────
    #
    # Cost rule: a pre_* hook fires INLINE on the agent's own path (pre_tool_call on
    # the tool path, pre_api_request on the request path), so every callback here
    # does the minimum — build a small dict and queue it. All serialisation and
    # file I/O happen on the writer thread. Every callback is wrapped and never
    # raises into the agent; pre_tool_call returns None (observer only, never a
    # block/approve/modify directive).
    
    def _tool_fields(kw: dict) -> dict:
        return {
            "tool_call_id": kw.get("tool_call_id") or "",
            "turn_id": kw.get("turn_id") or "",
            "session_id": kw.get("session_id") or "",
            "api_request_id": kw.get("api_request_id") or "",
            "task_id": kw.get("task_id") or "",
        }
    
    
    def _on_tool_call_start(**kw) -> None:
        """pre_tool_call — FULL tool arguments, the moment the tool is dispatched."""
        try:
            name = kw.get("tool_name") or kw.get("name") or ""
            args, trunc = _full_json(kw.get("args"), TOOL_MAX_CHARS)
            fields = _tool_fields(kw)
            _set_phase("tool_running", tool=name, **fields)
            _enqueue(dict({"event": "tool_call", "tool": name, "name": name,
                           "args": args, "args_truncated": trunc,
                           "args_chars": _chars_of(args)},
                          **fields, **_hk_fields()))
        except Exception:
            _count("errors")
        return None
    
    
    def _on_tool_call_end(**kw) -> None:
        """post_tool_call — FULL result body, status, error, duration."""
        try:
            name = kw.get("tool_name") or kw.get("name") or ""
            args, args_trunc = _full_json(kw.get("args"), TOOL_MAX_CHARS)
            result, res_trunc = _full_json(kw.get("result"), TOOL_MAX_CHARS)
            fields = _tool_fields(kw)
            _set_phase("tool_result", tool=name, **fields)
            _enqueue(dict({
                "event": "tool_result", "tool": name, "name": name,
                "args": args, "result": result,
                "args_truncated": args_trunc, "result_truncated": res_trunc,
                "args_chars": _chars_of(args), "result_chars": _chars_of(result),
                "status": kw.get("status"),
                "error_type": kw.get("error_type"),
                "error_message": kw.get("error_message") or "",
                "duration_ms": kw.get("duration_ms"),
            }, **fields, **_hk_fields()))
        except Exception:
            _count("errors")
    
    
    def _on_stream_start(**kw) -> None:
        try:
            fields = _turn_fields(kw)
            _hk_update(surface=fields.get("surface"))
            with _state_lock:
                _state["active_turn_id"] = fields["turn_id"]
            _set_phase("turn_active", **fields)
            _enqueue(dict({"event": "turn_start"}, **fields, **_hk_fields()))
        except Exception:
            _count("errors")
    
    
    def _on_stream_delta(delta="", kind="text", **kw) -> None:
        try:
            if not isinstance(delta, str) or not delta:
                return
            if len(delta) > DELTA_MAX_CHARS:
                delta = delta[:DELTA_MAX_CHARS] + "\u2026[truncated]"
            kind = kind if kind in ("text", "reasoning") else "text"
            fields = _turn_fields(kw)
            _hk_update(surface=fields.get("surface"))
            key = _turn_key(fields["turn_id"], fields["iteration"])
            with _state_lock:
                turn = _state["turns"].setdefault(
                    key, {"delta_count": 0, "text_chars": 0, "reasoning_chars": 0})
                turn["delta_count"] += 1
                if kind == "reasoning":
                    turn["reasoning_chars"] += len(delta)
                else:
                    turn["text_chars"] += len(delta)
                if len(_state["turns"]) > 64:  # bound the bookkeeping dict
                    for old in list(_state["turns"])[:16]:
                        _state["turns"].pop(old, None)
                tc = turn["text_chars"]
                rc = turn["reasoning_chars"]
            _set_phase("generating_reasoning" if kind == "reasoning"
                       else "generating_text", **fields)
            ev = dict({"event": "delta", "kind": kind, "delta": delta,
                       "text_chars": tc, "reasoning_chars": rc},
                      **fields, **_hk_fields())
            _enqueue(ev)
        except Exception:
            _count("errors")
    
    
    def _on_stream_end(final_text="", finished=True, error=None, **kw) -> None:
        try:
            fields = _turn_fields(kw)
            _hk_update(surface=fields.get("surface"))
            key = _turn_key(fields["turn_id"], fields["iteration"])
            with _state_lock:
                turn = dict(_state["turns"].get(key)
                            or {"delta_count": 0, "text_chars": 0,
                                "reasoning_chars": 0})
            text = final_text if isinstance(final_text, str) else ""
            trunc = len(text) > CONTEXT_MAX_CHARS
            if trunc:
                text = text[:CONTEXT_MAX_CHARS] + "\u2026[truncated]"
            ev = dict({
                "event": "stream_end",
                "final_text": text,
                "final_text_truncated": trunc,
                "finished": bool(finished),
                "error": (str(error) if error else None),
                "delta_count": turn["delta_count"],
                "text_chars": turn["text_chars"],
                "reasoning_chars": turn["reasoning_chars"],
            }, **fields, **_hk_fields())
            _enqueue(ev)
            # Carry the turn fields on the closing transition too, so this beat is
            # attributable like every other one (a consumer filtering by turn would
            # otherwise drop the boundary that closes it).
            _set_phase("idle", **fields)
            # NOTE: the active turn id is deliberately NOT cleared here.
            # on_stream_end marks the end of ONE API CALL, not of the turn: a
            # tool-calling turn continues with further iterations, and clearing the
            # id here made every watchdog beat after the first iteration carry
            # turn_id "" (measured: the "blocked inside a tool call" beats that
            # cover a 12-second tool call were unattributable). The id is
            # overwritten by the next turn's on_stream_start / pre_api_request, and
            # once the turn really is over the beats say phase:"idle" + idle_for.
        except Exception:
            _count("errors")
    
    
    def _on_pre_api_request(**kw) -> None:
        """Request path: build references only, never serialise here."""
        try:
            surface = kw.get("surface") or ""
            platform = kw.get("platform") or ""
            _hk_update(surface=surface, platform=platform)
            _set_phase("provider_wait",
                       turn_id=kw.get("turn_id") or "",
                       session_id=kw.get("session_id") or "",
                       model=kw.get("model") or "",
                       provider=kw.get("provider") or "",
                       surface=surface or platform)
            _enqueue(dict({
                "event": "input_context",
                "turn_id": kw.get("turn_id") or "",
                "api_call_count": kw.get("api_call_count"),
                "api_request_id": kw.get("api_request_id") or "",
                "task_id": kw.get("task_id") or "",
                "session_id": kw.get("session_id") or "",
                "model": kw.get("model") or "",
                "provider": kw.get("provider") or "",
                "api_mode": kw.get("api_mode") or "",
                "platform": platform,
                "message_count": kw.get("message_count"),
                "tool_count": kw.get("tool_count"),
                "approx_input_tokens": kw.get("approx_input_tokens"),
                "request_char_count": kw.get("request_char_count"),
                "max_tokens": kw.get("max_tokens"),
                "started_at": kw.get("started_at"),
                "_raw": {
                    "request": kw.get("request"),
                    "system_prompt": kw.get("system_prompt") or "",
                    "user_message": kw.get("user_message") or "",
                    "request_messages": kw.get("request_messages"),
                    "conversation_history": kw.get("conversation_history"),
                },
            }, **_hk_fields()))
        except Exception:
            _count("errors")
    
    
    def _on_post_api_request(**kw) -> None:
        """Fire on EVERY finished API call; carries the answer on non-stream paths."""
        try:
            turn_id = kw.get("turn_id") or ""
            iteration = kw.get("api_call_count")
            key = _turn_key(turn_id, iteration)
            with _state_lock:
                turn = dict(_state["turns"].get(key) or {})
            streamed = int(turn.get("delta_count") or 0) > 0
    
            msg = kw.get("assistant_message")
            text = ""
            try:
                cand = getattr(msg, "content", None) if msg is not None else None
                if isinstance(cand, str):
                    text = cand
            except Exception:
                text = ""
            if streamed:
                text_out, trunc = "", False
            else:
                trunc = len(text) > CONTEXT_MAX_CHARS
                text_out = (text[:CONTEXT_MAX_CHARS] + "\u2026[truncated]") if trunc else text
    
            usage, _t, _s = _bound_json(kw.get("usage"), 2000)
            if not streamed:
                # A call that never streamed (cron / subagent / provider without
                # SSE) still gets a stream boundary, explicitly marked as
                # synthesised: the runtime fires on_stream_end only on the
                # streaming path, and a consumer must be able to close the turn it
                # saw an input_context for. delta_count 0 = nothing streamed.
                _enqueue(dict({
                    "event": "stream_end",
                    "synthesized": True,
                    "turn_id": turn_id,
                    "iteration": iteration,
                    "session_id": kw.get("session_id") or "",
                    "model": kw.get("model") or "",
                    "provider": kw.get("provider") or "",
                    "surface": kw.get("platform") or "",
                    "final_text": text_out,
                    "final_text_truncated": trunc,
                    "finished": True,
                    "error": None,
                    "delta_count": 0,
                    "text_chars": 0,
                    "reasoning_chars": 0,
                }, **_hk_fields()))
            n_tools = kw.get("assistant_tool_call_count")
            try:
                n_tools_i = int(n_tools or 0)
            except Exception:
                n_tools_i = 0
            _set_phase("tool_args" if n_tools_i > 0 else "idle",
                       turn_id=turn_id, session_id=kw.get("session_id") or "",
                       model=kw.get("model") or "", provider=kw.get("provider") or "",
                       surface=kw.get("platform") or "")
            ev = dict({
                "event": "completion",
                "turn_id": turn_id,
                "iteration": iteration,
                "api_call_count": iteration,
                "session_id": kw.get("session_id") or "",
                "model": kw.get("model") or "",
                "provider": kw.get("provider") or "",
                "api_mode": kw.get("api_mode") or "",
                "platform": kw.get("platform") or "",
                "finish_reason": kw.get("finish_reason"),
                "api_duration": kw.get("api_duration"),
                "response_model": kw.get("response_model"),
                "usage": usage,
                "assistant_content_chars": kw.get("assistant_content_chars"),
                "assistant_tool_call_count": kw.get("assistant_tool_call_count"),
                "streamed": streamed,
                "text": text_out,
                "text_truncated": trunc,
            }, **_hk_fields())
            _enqueue(ev)
        except Exception:
            _count("errors")
    
    
    # ── plugin entry point ────────────────────────────────────────────────────
    
    HOOKS = ("on_stream_start", "on_stream_delta", "on_stream_end",
             "pre_api_request", "post_api_request",
             "pre_tool_call", "post_tool_call")
    
    
    def register(ctx) -> None:
        """Hermes plugin entry point: start the writers, register every hook."""
        try:
            _start()
            ctx.register_hook("on_stream_start", _on_stream_start)
            ctx.register_hook("on_stream_delta", _on_stream_delta)
            ctx.register_hook("on_stream_end", _on_stream_end)
            ctx.register_hook("pre_api_request", _on_pre_api_request)
            ctx.register_hook("post_api_request", _on_post_api_request)
            ctx.register_hook("pre_tool_call", _on_tool_call_start)
            ctx.register_hook("post_tool_call", _on_tool_call_end)
            with _state_lock:
                _state["loaded"] = True
                _state["pid"] = os.getpid()
                _state["started"] = time.time()
                _state["hooks"] = list(HOOKS)
            _write_state()
            _enqueue({"event": "plugin_state", "state": "loaded",
                      "hooks": list(HOOKS), "log_dir": log_dir(),
                      "pid": os.getpid()})
        except Exception:
            _count("errors")
---
# ── Comm-gate plugin (the "load the comm skill first" gate) ───────────────
# Mounted into BOTH containers: the agent loads it as a plugin; the watch
# container gets the same path so the deploy probe can prove it is installed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sudo-caesar-comm-gate-plugin
  labels:
    app: sudo-agent
    agent: caesar
data:
  plugin.yaml: |
    name: sudo-comm-gate
    version: "1.0.0"
    description: "Deterministic prerequisite gate for the comm tools. Records, per session, that a comm skill was loaded (on_skill_lifecycle) and blocks a terminal command that runs a comm CLI until its matching skill was loaded this session (pre_tool_call). Stdlib-only, observer + block, never raises into the agent."
    author: forge-3
    kind: standalone
    hooks:
      - on_skill_lifecycle
      - pre_tool_call
  __init__.py: |
    """sudo-comm-gate — the "load the comm skill first" gate, plugin half.
    
    WHY THIS EXISTS
    ---------------
    The three comm tools (list-siblings, message-agent, check-agent) are plain
    Python CLIs the engineer runs through its terminal tool. The skills teach the
    exact syntax, but nothing stops a model from running the CLI without ever
    loading the skill. This plugin closes that gap with a deterministic,
    per-session prerequisite gate — the industry pattern of "block transfer_funds
    until aml_check passed this session", here "block `message_agent.py` until the
    `message-agent` skill was loaded this session".
    
    Two hooks:
    
    * ``on_skill_lifecycle`` — Hermes fires this when the agent loads a skill via
      ``skill_view`` (action="loaded", with ``skill_name`` + ``session_id``). The
      plugin records ``{session_id -> {skill_name: epoch}}`` in
      ``<HERMES_HOME>/comm-gate/state.json``.
    
    * ``pre_tool_call`` — when a terminal command references one of the three comm
      CLIs and that CLI's matching skill was NOT loaded this session, return
      ``{"action": "block", "message": "BLOCKED: load the <skill> skill first,
      then retry."}``. Hermes vetoes the call and surfaces the message to the
      model, so it can load the skill and retry in the same turn.
    
    The CLI half (``comm/tools/comm_gate.py``) enforces the same rule independently:
    each CLI reads ``HERMES_SESSION_ID`` + the same state file and exits 69 with
    the BLOCKED message when the skill is missing — so the gate holds even when the
    plugin is somehow not in the path, and holds not at all when there is no Hermes
    session (a human/script running the CLI directly keeps working).
    
    HARD RULES (a plugin must never hurt the agent it observes)
    -----------------------------------------------------------
    * Every callback is wrapped in try/except and never raises.
    * State writes are atomic (tmp + os.replace) and never block the agent.
    * stdlib only; additive — the only file written is ``comm-gate/state.json``.
    """
    
    from __future__ import annotations
    
    import json
    import os
    import time
    
    PLUGIN_NAME = "sudo-comm-gate"
    DEFAULT_HOME = "/opt/data"
    
    #: the three comm skills, and the CLI filename markers that identify each.
    COMM_SKILLS = {
        "list-siblings": ("list_siblings.py",),
        "message-agent": ("message_agent.py",),
        "check-agent": ("check_agent.py",),
    }
    
    #: bound the ledger so a long-lived agent cannot grow it without limit.
    MAX_SESSIONS = 500
    
    
    def _home() -> str:
        return os.environ.get("HERMES_HOME") or DEFAULT_HOME
    
    
    def gate_dir() -> str:
        return os.path.join(_home(), "comm-gate")
    
    
    def state_path() -> str:
        return os.path.join(gate_dir(), "state.json")
    
    
    def load_state() -> dict:
        try:
            with open(state_path(), encoding="utf-8") as f:
                data = json.load(f)
        except (OSError, ValueError):
            return {}
        return data if isinstance(data, dict) else {}
    
    
    def _write_state(state: dict) -> None:
        """Atomic best-effort persist. Never raises."""
        try:
            d = gate_dir()
            os.makedirs(d, exist_ok=True)
            tmp = os.path.join(d, "state.json.tmp.%d" % os.getpid())
            with open(tmp, "w", encoding="utf-8") as f:
                json.dump(state, f, ensure_ascii=False)
            os.replace(tmp, state_path())
        except Exception:
            pass
    
    
    def _prune(state: dict, current: str) -> dict:
        """Drop the oldest sessions past MAX_SESSIONS, always keeping `current`."""
        if len(state) <= MAX_SESSIONS:
            return state
        keys = [k for k in state if k != current]
        keep = keys[-(MAX_SESSIONS - 1):]
        return {k: state[k] for k in keep}
    
    
    def _record_skill_load(session_id: str, skill_name: str) -> None:
        if not session_id or skill_name not in COMM_SKILLS:
            return
        state = load_state()
        entry = state.get(session_id)
        if not isinstance(entry, dict):
            entry = {}
        entry[skill_name] = time.time()
        state[session_id] = entry
        _write_state(_prune(state, session_id))
    
    
    def _skill_loaded(session_id: str, skill_name: str) -> bool:
        state = load_state()
        entry = state.get(session_id)
        if not isinstance(entry, dict):
            return False
        return skill_name in entry
    
    
    def _comm_skill_in_command(command) -> str | None:
        """Return the comm skill whose CLI the command invokes, else None."""
        if not isinstance(command, str) or not command:
            return None
        for skill, markers in COMM_SKILLS.items():
            for marker in markers:
                if marker in command:
                    return skill
        return None
    
    
    def _on_skill_lifecycle(**kw) -> None:
        """Record "skill X was loaded this session" (action == "loaded")."""
        try:
            if kw.get("action") != "loaded":
                return
            _record_skill_load(kw.get("session_id") or "", kw.get("skill_name") or "")
        except Exception:
            pass
        return None
    
    
    def _on_pre_tool_call(**kw):
        """Block a comm-CLI terminal command until its skill was loaded."""
        try:
            args = kw.get("args")
            if not isinstance(args, dict):
                return None
            skill = _comm_skill_in_command(args.get("command"))
            if skill is None:
                return None
            session_id = kw.get("session_id") or ""
            if not session_id:
                return None  # no session context: let the CLI's own gate decide
            if _skill_loaded(session_id, skill):
                return None
            return {
                "action": "block",
                "message": f"BLOCKED: load the {skill} skill first, then retry.",
            }
        except Exception:
            return None
    
    
    def register(ctx) -> None:
        """Hermes plugin entry point: register the two gate hooks."""
        try:
            ctx.register_hook("on_skill_lifecycle", _on_skill_lifecycle)
            ctx.register_hook("pre_tool_call", _on_pre_tool_call)
        except Exception:
            pass
